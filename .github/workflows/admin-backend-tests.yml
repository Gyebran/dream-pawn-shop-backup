name: Admin backend tests
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl, zip, bcmath
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Check PHP syntax
        run: find app routes database/migrations database/seeders tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run feature tests
        run: php artisan test
